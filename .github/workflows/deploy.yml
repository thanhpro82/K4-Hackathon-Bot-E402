name: Automated Test & CI/CD Deployment Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # JOB 1: MANDATORY AUTOMATED TESTING (Chỉ khi PASS 100% mới chuyển sang Deploy)
  test:
    name: Run Automated Eval & Codebase Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run RAG Engine Eval Golden Set (25 Test Cases)
        run: |
          python eval/run_eval.py

      - name: Run Discord Bot Simulator CLI Test
        run: |
          python codebase/app_bot.py

  # JOB 2: DEPLOY TO GITHUB PAGES (Phụ thuộc vào JOB 1 Test Pass)
  deploy:
    name: Deploy to GitHub Pages
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
